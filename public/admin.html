<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>Amber Admin</title>
</head>
<body class="bg-gray-100 p-8">
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8">Amber Admin Dashboard</h1>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Short Link</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Original URL</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Visits</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody id="links-table-body" class="bg-white divide-y divide-gray-200">
                <!-- Data will be populated here by JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    fetchLinks();
});

function fetchLinks() {
    fetch('/admin/links/all')
        .then(response => {
            if (!response.ok) {
                if (response.status === 401) {
                    alert('Unauthorized');
                }
                throw new Error('Failed to fetch links');
            }
            return response.json();
        })
        .then(data => {
            if (data.status === 'success') {
                renderTable(data.links);
            }
        })
        .catch(err => console.error(err));
}

function renderTable(links) {
    const tbody = document.getElementById('links-table-body');
    tbody.innerHTML = '';

    links.forEach(link => {
        const tr = document.createElement('tr');

        const tdShort = document.createElement('td');
        tdShort.className = 'px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900';
        tdShort.textContent = link.id;
        tr.appendChild(tdShort);

        const tdOrig = document.createElement('td');
        tdOrig.className = 'px-6 py-4 text-sm text-gray-500';
        tdOrig.textContent = link.url;
        // make it wrap or truncate if too long
        tdOrig.style.maxWidth = '300px';
        tdOrig.style.overflow = 'hidden';
        tdOrig.style.textOverflow = 'ellipsis';
        tdOrig.style.whiteSpace = 'nowrap';
        tr.appendChild(tdOrig);

        const tdVisits = document.createElement('td');
        tdVisits.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-500';
        tdVisits.textContent = link.visits;
        tr.appendChild(tdVisits);

        const tdActions = document.createElement('td');
        tdActions.className = 'px-6 py-4 whitespace-nowrap text-right text-sm font-medium';
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'text-red-600 hover:text-red-900';
        deleteBtn.onclick = () => deleteLink(link.id);
        tdActions.appendChild(deleteBtn);
        tr.appendChild(tdActions);

        tbody.appendChild(tr);
    });
}

function deleteLink(shortLink) {
    if (!confirm('Are you sure you want to delete this link?')) return;

    fetch('/admin/delete/' + shortLink, {
        method: 'DELETE'
    })
    .then(response => {
        if (!response.ok) throw new Error('Failed to delete');
        return response.json();
    })
    .then(data => {
        if (data.status === 'success') {
            fetchLinks(); // refresh the table
        }
    })
    .catch(err => alert('Error: ' + err.message));
}
</script>
</body>
</html>
