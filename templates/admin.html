<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/main.css">
    <title>Amber Admin</title>
</head>
<body class="bg-gray-100 p-8">
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8">Amber Admin Dashboard</h1>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Short Link</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Original URL</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Visits</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody id="links-table-body" class="bg-white divide-y divide-gray-200">
                {{range .links}}
                <tr id="row-{{.Id}}">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{.Id}}</td>
                    <td class="px-6 py-4 text-sm text-gray-500" style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{.URL}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{.Visits}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="deleteLink('{{.Id}}')" class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                </tr>
                {{end}}
                {{if not .links}}
                <tr>
                    <td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">No links found.</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

<script>
function deleteLink(shortLink) {
    if (!confirm('Are you sure you want to delete this link?')) return;

    fetch('/admin/delete/' + shortLink, {
        method: 'DELETE'
    })
    .then(response => {
        if (!response.ok) throw new Error('Failed to delete');
        return response.json();
    })
    .then(data => {
        if (data.status === 'success') {
            const row = document.getElementById('row-' + shortLink);
            if (row) row.remove();
        }
    })
    .catch(err => alert('Error: ' + err.message));
}
</script>
</body>
</html>
